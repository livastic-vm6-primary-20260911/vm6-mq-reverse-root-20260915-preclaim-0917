pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 2
    queue_conditions: []
    merge_conditions:
      - check-success = mq-e2e
    max_checks_retries: 0
    checks_timeout: 15 min
    merge_method: merge
    update_method: rebase
