scopes:
  source:
    files:
      backend:
        include:
          - "src/**"
      docs:
        include:
          - "docs/**"

pull_request_rules:
  - name: VM6 autoqueue batch-scope mismatch 20260930
    conditions:
      - title = VM6_MQ_BATCH_SCOPE_20260930
      - author = livastic-vm6-primary-rn260917
      - "#files = 1"
      - files = docs/vm6-mq-batch-scope.txt
      - check-success = vm6-source-scope-report
    actions:
      queue:

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm6-mq-batch-scope-20260930
    batch_size: 1
    queue_conditions:
      - title = VM6_MQ_BATCH_SCOPE_20260930
      - author = livastic-vm6-primary-rn260917
      - check-success = vm6-source-scope-report
    merge_conditions:
      - check-success = vm6-mq-scope-gate
    max_checks_retries: 0
    checks_timeout: 10 min
    merge_method: merge
    update_method: rebase
