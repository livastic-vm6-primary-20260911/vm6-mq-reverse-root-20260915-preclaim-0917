name: VM6 MQ Batch Scope Gate 20260930
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect:
    name: vm6-mq-scope-detect
    if: startsWith(github.event.pull_request.title, 'merge queue:')
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check 'mergify-cli==2026.9.16.1'
      - id: scopes
        run: mergify ci scopes
      - env:
          SCOPES: ${{ steps.scopes.outputs.scopes }}
        run: echo "VM6_RELEASED_SCOPES=$SCOPES"

  backend-security:
    name: vm6-backend-security
    needs: detect
    if: needs.detect.result == 'success' && fromJSON(needs.detect.outputs.scopes).backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "VM6_BACKEND_SECURITY_RAN=1"
          exit 1

  vm6-mq-scope-gate:
    name: vm6-mq-scope-gate
    needs: [detect, backend-security]
    if: always() && startsWith(github.event.pull_request.title, 'merge queue:')
    runs-on: ubuntu-latest
    steps:
      - env:
          DETECT_RESULT: ${{ needs.detect.result }}
          SECURITY_RESULT: ${{ needs.backend-security.result }}
        run: |
          echo "VM6_DETECT_RESULT=$DETECT_RESULT"
          echo "VM6_SECURITY_RESULT=$SECURITY_RESULT"
          test "$DETECT_RESULT" = "success"
          test "$SECURITY_RESULT" = "skipped"
